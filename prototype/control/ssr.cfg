# ssr.cfg - the cluster, in one file. The same copy goes on every host: ssrd
# finds its own [nodeN] section by hostname, ssrctl reads them all. Nothing
# here is per-host. The [nodeN] sections are RENDERED from the testbed's
# topology (testbed/manifest.yaml + ncs-fabric's ops/manifest.py, through
# testbed/render-cfg.py); edit the manifest, not them.
#
# The dataplane is one bitstream for the whole cluster. Who a card is and how
# its round is timed are registers that ssrd writes at start-up from this
# file: the identity from the node's section, the round from [cluster], the
# instants derived in ssrd (derive_round in ssrd.cpp). The FPGA derives
# nothing.
#
# Every node's card has two ports.
#   - Port 0, ssr_iface, carries the SSR protocol (ethertype 0x88B5) and nothing else;
#     it needs no address.
#   - Port 1, ctl_iface, carries everything else: PTP, this control plane's gRPC, ssh.
#     Both share the card's one PHC, which is why PTP on port 1 disciplines the clock that the
#     core stamps rounds with on port 0.

[cluster]
grandmaster = 0             # the node whose PHC every other node follows
rounds_ahead = 250          # a run starts this many rounds after "now" (1 ms at 4 us): the
                            # reconfiguration latency, so as low as the gRPC fan-out allows
ptp_max_offset_ns = 50      # the clock gate: every node within this of the grandmaster.
                            # 0 switches the gate off (single-node tests)

# The round. round_ns must divide 1e9. prop_ns is the one-way delay through
# the fabric (250 through a switch; a direct link is far less). guard_ns is
# the clock skew the round tolerates - keep it at ptp_max_offset_ns.
# frags_per_round is the payload budget per node per round; the round must be
# long enough for them, and ssrd refuses to start otherwise. quorum defaults
# to N/2+1 of the nodes listed here; set it only for an experiment.
round_ns = 125000           # 2026-09-27 bring-up: absurdly wide (8000 rounds/s, deadline ~30 us)
prop_ns = 30000             # to test the logic with latency out of the picture. Every peer control
                            # frame was RX_CTRL_LATE at deadlines of 2044 and 2176 ns; the one-hop
                            # delay through Corundum tx + Tofino + Corundum rx is still unmeasured.
                            # Target: round 4000, prop ~2000, 3 frags (or 8000 / 8 frags)
guard_ns = 50
frags_per_round = 5
# quorum = 2

[node0]
host = inet-p4lab-14           # fpga5, rendered from the testbed topology
ctl = 177.0.5.2:50051
ssr_iface = enp202s0np0        # 10/0 on the switch
ssr_netns = fpga5_p1
ctl_iface = enp202s0np1        # 29/0
ctl_netns = fpga5_p2

[node1]
host = inet-p4lab-13           # fpga3, rendered from the testbed topology
ctl = 177.0.3.2:50051
ssr_iface = enp202s0np0        # 6/0 on the switch
ssr_netns = fpga3_p1
ctl_iface = enp202s0np1        # 27/0
ctl_netns = fpga3_p2

[node2]
host = inet-p4lab-12           # fpga1, rendered from the testbed topology
ctl = 177.0.1.2:50051
ssr_iface = enp202s0np0        # 2/0 on the switch
ssr_netns = fpga1_p1
ctl_iface = enp202s0np1        # 25/0
ctl_netns = fpga1_p2
